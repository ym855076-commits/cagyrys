<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Çagyryş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --gyzyl:#6e1316; --gyzyl-dark:#3a0a0c; --pergament:#f2e8d0;
  --altyn:#c9a24a; --gara:#1d0607;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--pergament);background:var(--gyzyl-dark);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background-image:
    linear-gradient(45deg,rgba(201,162,74,.07) 25%,transparent 25%,transparent 75%,rgba(201,162,74,.07) 75%),
    linear-gradient(45deg,rgba(201,162,74,.07) 25%,transparent 25%,transparent 75%,rgba(201,162,74,.07) 75%);
  background-size:36px 36px;background-position:0 0,18px 18px;
}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 40px}
.frame{
  border:2px solid var(--altyn);outline:1px solid var(--altyn);outline-offset:5px;
  background:var(--gyzyl);padding:34px 20px 30px;text-align:center;
}
.intro{font-size:15px;letter-spacing:.02em;opacity:.9}
.gul{
  width:min(300px,82vw);aspect-ratio:1;margin:24px auto;
  background:var(--altyn);
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  display:grid;place-items:center;
}
.gul-in{
  width:calc(100% - 10px);height:calc(100% - 10px);background:var(--gara);
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 14%;
}
.name{font-family:var(--serif);font-weight:700;font-size:clamp(30px,10vw,42px);line-height:1.05;color:var(--pergament)}
.amp{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--altyn)}
.lead{font-family:var(--serif);font-style:italic;font-size:21px;margin-bottom:6px}
.info{margin:26px 0 8px;display:grid;gap:14px}
.info div{border-top:1px solid rgba(201,162,74,.5);padding-top:12px}
.info small{display:block;font-size:13px;opacity:.75;margin-bottom:2px}
.info b{font-family:var(--serif);font-size:22px;font-weight:700}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:28px 0 6px}
.count div{background:var(--gara);border:1px solid var(--altyn);padding:10px 0}
.count b{display:block;font-family:var(--serif);font-size:30px;color:var(--altyn)}
.count span{font-size:12px;opacity:.8}
.btns{display:grid;gap:10px;margin-top:26px}
.btn{
  display:block;padding:15px;border:2px solid var(--altyn);color:var(--pergament);
  text-decoration:none;font-weight:600;font-size:16px;background:transparent;cursor:pointer;font-family:inherit;
}
.btn.main{background:var(--altyn);color:var(--gara)}
.btn:focus-visible{outline:3px solid var(--pergament);outline-offset:3px}
.demo{margin-top:22px;font-size:12px;text-align:center;opacity:.55}
.done{font-family:var(--serif);font-size:24px;color:var(--altyn)}
[hidden]{display:none!important}
.order{margin-top:22px;border:1px solid var(--altyn);background:var(--gara);padding:22px 18px;text-align:center}
.order h2{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.order p{font-size:15px;line-height:1.5}
.order .price{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--altyn);margin:10px 0 16px}
.order .btns{margin-top:0}
@media (prefers-reduced-motion:no-preference){
  .gul{animation:in .9s ease-out both}
  @keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
}
.lang{display:flex;justify-content:flex-end;gap:6px;margin:-18px 0 10px}
.lang button{font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border:1px solid var(--altyn);background:transparent;color:var(--pergament);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--altyn);color:var(--gara)}
.lang button:focus-visible{outline:2px solid var(--pergament);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <section class="frame">
    <div class="lang" role="group" aria-label="Dil / Язык">
      <button type="button" data-lang="tk">TM</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
    <p class="intro" id="intro"></p>
    <div class="gul"><div class="gul-in">
      <span class="name" id="a"></span>
      <span class="amp" id="amp">&amp;</span>
      <span class="name" id="b"></span>
    </div></div>
    <p class="lead" id="lead"></p>
    <div class="info">
      <div><small data-t="date"></small><b id="dateTxt"></b></div>
      <div><small data-t="time"></small><b id="timeTxt"></b></div>
      <div><small data-t="place"></small><b id="place"></b></div>
    </div>
    <div class="count" id="count">
      <div><b id="cd">0</b><span data-t="ud"></span></div>
      <div><b id="ch">0</b><span data-t="uh"></span></div>
      <div><b id="cm">0</b><span data-t="um"></span></div>
      <div><b id="cs">0</b><span data-t="us"></span></div>
    </div>
    <div class="btns">
      <a class="btn main" id="rsvp" href="#"></a>
      <button class="btn" id="copy" type="button"></button>
      <a class="btn" id="map" href="#" target="_blank" rel="noopener" data-t="map"></a>
      <button class="btn" id="share" type="button" data-t="share"></button>
    </div>
  </section>
  <section class="order" id="order" hidden>
    <h2 data-t="oh"></h2>
    <p data-t="op"></p>
    <div class="price">100 TMT</div>
    <div class="btns">
      <a class="btn main" href="tel:+99363778188" data-t="oc"></a>
      <a class="btn" href="https://wa.me/99363778188" target="_blank" rel="noopener" data-t="ow"></a>
      <p style="font-size:14px;opacity:.85;margin-top:4px" data-t="oi"></p>
    </div>
  </section>
</main>

<script>
/* Ssylka parametrleri: a=Ad1 b=Ad2 (boş = bir ad) d=2027-03-20T18:00 p=Ýer t=telefon
   e=birthday|wedding|jubilee  l=öz tekst (tm)  lr=öz tekst (ru)  i=salamlaşyk
   lg=ru (dil)  w=1 (jaň ýerine WhatsApp)  boşluk ýerine + ýazyň */
var q = new URLSearchParams(location.search);
var cfg = {
  a: q.get('a') || 'Aýdogdy',
  b: q.has('b') ? q.get('b') : 'Merjen',
  d: q.get('d') || '2027-03-20T18:00',
  p: q.get('p') || '«Ak öý» toý merkezi, Türkmenabat',
  t: (q.get('t') || '99363778188').replace(/\D/g,''),
  e: q.get('e') || 'wedding',
  l: q.get('l'), lr: q.get('lr'), i: q.get('i'),
  lg: q.get('lg') === 'ru' ? 'ru' : 'tk'
};
var T = {
  tk: {
    intro:'Hormatly myhmanlarymyz!',
    ev_birthday:'sizi doglan gün baýramyna çagyrýarys',
    ev_wedding:'sizi toýumyza çagyrýarys',
    ev_jubilee:'sizi ýubileýimize çagyrýarys',
    date:'Sene', time:'Wagty', place:'Ýeri',
    ud:'gün', uh:'sagat', um:'minut', us:'sekunt',
    rsvpC:'Jaň edip habar bermek', rsvpW:'Barjakdygymy habar bermek',
    copy:'IMO üçin belgini göçürmek', copied:'Göçürildi: ',
    map:'Kartada görkezmek', share:'Çagyryşy paýlaşmak', shared:'Ssylka göçürildi',
    done:'Çäre başlandy!', title:' – çagyryş',
    wa:'Salam! {n} çagyryşyna barýaryn.',
    months:['ýanwar','fewral','mart','aprel','maý','iýun','iýul','awgust','sentýabr','oktýabr','noýabr','dekabr'],
    oh:'Şeýle çagyryş isleýärsiňizmi?',
    op:'Toý, ýubileý, doglan gün we başga çäreler üçin. Atlaryňyzy, senäni we ýeri ýazyň, men size ýörite ssylka taýýarlaýaryn.',
    oc:'Jaň etmek: +993 63 778188', ow:'WhatsApp-da ýazmak',
    oi:'IMO-da hem ýazyp bilersiňiz: +993 63 778188'
  },
  ru: {
    intro:'Уважаемые гости!',
    ev_birthday:'Приглашаем вас на день рождения',
    ev_wedding:'Приглашаем вас на нашу свадьбу',
    ev_jubilee:'Приглашаем вас на юбилей',
    date:'Дата', time:'Время', place:'Место',
    ud:'дней', uh:'часов', um:'минут', us:'секунд',
    rsvpC:'Позвонить и подтвердить', rsvpW:'Подтвердить участие',
    copy:'Скопировать номер для IMO', copied:'Скопировано: ',
    map:'Показать на карте', share:'Поделиться приглашением', shared:'Ссылка скопирована',
    done:'Праздник начался!', title:' – приглашение',
    wa:'Здравствуйте! Приду на приглашение: {n}.',
    months:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
    oh:'Хотите такое приглашение?',
    op:'На свадьбу, юбилей, день рождения и другие праздники. Пришлите имя, дату и место, и я подготовлю для вас ссылку.',
    oc:'Позвонить: +993 63 778188', ow:'Написать в WhatsApp',
    oi:'Можно написать и в IMO: +993 63 778188'
  }
};
var lang = cfg.lg;
var target = new Date(cfg.d);
function $(id){return document.getElementById(id)}
function names(){return cfg.a + (cfg.b ? ' & ' + cfg.b : '')}

$('a').textContent = cfg.a;
$('b').textContent = cfg.b;
$('place').textContent = cfg.p;
if (!cfg.b) { $('amp').hidden = true; $('b').hidden = true; }
if (!q.has('a')) { $('order').hidden = false; }
$('map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cfg.p);
if (!isNaN(target)) {
  $('timeTxt').textContent = String(target.getHours()).padStart(2,'0') + ':' + String(target.getMinutes()).padStart(2,'0');
}

function applyLang(L){
  lang = L; var D = T[L];
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = D[el.dataset.t]; });
  document.querySelectorAll('[data-lang]').forEach(function(bt){ bt.setAttribute('aria-pressed', bt.dataset.lang === L); });
  $('intro').textContent = cfg.i || D.intro;
  var own = L === 'ru' ? (cfg.lr || cfg.l) : cfg.l;
  $('lead').textContent = own || D['ev_' + cfg.e] || D.ev_wedding;
  if (!isNaN(target)) $('dateTxt').textContent = target.getDate() + ' ' + D.months[target.getMonth()] + ' ' + target.getFullYear();
  if (q.has('w')) {
    $('rsvp').href = 'https://wa.me/' + cfg.t + '?text=' + encodeURIComponent(D.wa.replace('{n}', names()));
    $('rsvp').textContent = D.rsvpW;
    $('copy').hidden = true;
  } else {
    $('rsvp').href = 'tel:+' + cfg.t;
    $('rsvp').textContent = D.rsvpC;
    $('copy').hidden = false;
    $('copy').textContent = D.copy;
  }
  document.title = names() + D.title;
}

function tick(){
  var left = target - new Date();
  if (isNaN(left)) return;
  if (left <= 0) {
    $('count').innerHTML = '<p class="done" style="grid-column:1/-1"></p>';
    $('count').firstChild.textContent = T[lang].done;
    clearInterval(timer); return;
  }
  var s = Math.floor(left/1000);
  $('cd').textContent = Math.floor(s/86400);
  $('ch').textContent = Math.floor(s%86400/3600);
  $('cm').textContent = Math.floor(s%3600/60);
  $('cs').textContent = s%60;
}
var timer = setInterval(tick, 1000); tick();

document.querySelectorAll('[data-lang]').forEach(function(bt){
  bt.addEventListener('click', function(){ applyLang(bt.dataset.lang); tick(); });
});
$('copy').addEventListener('click', function(){
  var num = '+' + cfg.t;
  if (navigator.clipboard) { navigator.clipboard.writeText(num).then(function(){ $('copy').textContent = T[lang].copied + num; }); }
  else { prompt(num, num); }
});
$('share').addEventListener('click', function(){
  var data = {title: document.title, url: location.href};
  if (navigator.share) { navigator.share(data).catch(function(){}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(location.href).then(function(){ $('share').textContent = T[lang].shared; }); }
});
applyLang(lang);
</script>
</body>
</html>
